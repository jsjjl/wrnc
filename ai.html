<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:'Noto Sans SC',sans-serif;background:#050a08;color:#fff}

/* 粒子背景 */
#particles{position:fixed;inset:0;z-index:0}
#particles canvas{display:block}

/* 扫描线 */
.scan-line{position:fixed;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,rgba(0,255,160,0.15),transparent);animation:scan 4s linear infinite;z-index:1;pointer-events:none}
@keyframes scan{0%{top:-2px}100%{top:100vh}}

/* 主界面 */
.main-screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.6s,transform 0.6s}
.main-screen.hidden{opacity:0;transform:scale(0.95);pointer-events:none}

/* AI核心圆环 */
.ai-core{position:relative;width:180px;height:180px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.ai-core-ring{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(0,255,160,0.3);animation:ringPulse 2s ease-in-out infinite}
.ai-core-ring:nth-child(2){inset:12px;border-color:rgba(0,255,160,0.2);animation-delay:0.3s}
.ai-core-ring:nth-child(3){inset:24px;border-color:rgba(0,255,160,0.1);animation-delay:0.6s}
.ai-core-dot{position:absolute;inset:36px;border-radius:50%;background:radial-gradient(circle at 35% 35%,rgba(0,255,160,0.4),rgba(0,180,120,0.15));box-shadow:0 0 40px rgba(0,255,160,0.2),inset 0 0 20px rgba(0,255,160,0.1);animation:dotGlow 2s ease-in-out infinite}
.ai-core-icon{position:relative;z-index:2;font-size:48px;animation:float 3s ease-in-out infinite}
@keyframes ringPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.05);opacity:0.6}}
@keyframes dotGlow{0%,100%{box-shadow:0 0 40px rgba(0,255,160,0.2),inset 0 0 20px rgba(0,255,160,0.1)}50%{box-shadow:0 0 60px rgba(0,255,160,0.35),inset 0 0 30px rgba(0,255,160,0.15)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

.ai-core:active .ai-core-ring{animation-duration:0.5s}
.ai-core:active .ai-core-dot{transform:scale(0.95)}

/* 标题 */
.ai-title{text-align:center;margin-top:32px}
.ai-title h1{font-size:22px;font-weight:800;letter-spacing:4px;color:#fff;text-shadow:0 0 20px rgba(0,255,160,0.3)}
.ai-title p{font-size:12px;color:rgba(255,255,255,0.4);margin-top:8px;letter-spacing:1px}

/* 快捷卡片 */
.quick-cards{display:flex;gap:10px;margin-top:40px;padding:0 20px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.quick-cards::-webkit-scrollbar{display:none}
.quick-card{flex-shrink:0;width:140px;padding:16px;border-radius:16px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);backdrop-filter:blur(10px);scroll-snap-align:center;cursor:pointer;transition:all 0.3s}
.quick-card:active{transform:scale(0.96);background:rgba(255,255,255,0.08)}
.quick-card .icon{font-size:28px;margin-bottom:8px;display:block}
.quick-card .label{font-size:12px;font-weight:700;color:#fff}
.quick-card .desc{font-size:10px;color:rgba(255,255,255,0.4);margin-top:4px;line-height:1.4}

/* 聊天界面 */
.chat-screen{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;background:linear-gradient(180deg,#050a08 0%,#0a1512 100%);opacity:0;pointer-events:none;transition:opacity 0.4s}
.chat-screen.active{opacity:1;pointer-events:auto}

.chat-header{flex-shrink:0;display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid rgba(255,255,255,0.06)}
.chat-header-back{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;cursor:pointer}
.chat-header-back svg{width:16px;height:16px;stroke:#fff;stroke-width:2;fill:none}
.chat-header-info{flex:1}
.chat-header-info h2{font-size:15px;font-weight:700}
.chat-header-info p{font-size:11px;color:rgba(255,255,255,0.4);margin-top:2px}
.chat-header-status{width:8px;height:8px;border-radius:50%;background:#1DB954;box-shadow:0 0 8px #1DB954;animation:statusPulse 2s infinite}
@keyframes statusPulse{0%,100%{opacity:1}50%{opacity:0.4}}

.chat-messages{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:16px}
.chat-msg{max-width:85%;padding:12px 16px;border-radius:16px;font-size:13px;line-height:1.7;animation:msgIn 0.3s ease-out}
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.chat-msg.user{align-self:flex-end;background:linear-gradient(135deg,rgba(29,185,84,0.2),rgba(0,180,216,0.15));border:1px solid rgba(29,185,84,0.2);color:#fff}
.chat-msg.bot{align-self:flex-start;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);color:rgba(255,255,255,0.85)}
.chat-msg.bot b{color:#fff}
.chat-msg.typing{display:flex;align-items:center;gap:4px;padding:16px 20px}
.chat-msg.typing span{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.4);animation:typingBounce 1.4s infinite}
.chat-msg.typing span:nth-child(2){animation-delay:0.2s}
.chat-msg.typing span:nth-child(3){animation-delay:0.4s}
@keyframes typingBounce{0%,80%,100%{transform:scale(0.6);opacity:0.4}40%{transform:scale(1);opacity:1}}

.chat-input-area{flex-shrink:0;padding:12px 20px 24px;border-top:1px solid rgba(255,255,255,0.06)}
.chat-input-wrap{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:24px;padding:4px 4px 4px 16px}
.chat-input-wrap input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:14px;font-family:inherit}
.chat-input-wrap input::placeholder{color:rgba(255,255,255,0.3)}
.chat-input-wrap button{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#1DB954,#00B4D8);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform 0.2s}
.chat-input-wrap button:active{transform:scale(0.92)}
.chat-input-wrap button svg{width:18px;height:18px;stroke:#fff;stroke-width:2;fill:none}

/* 语音波纹 */
.voice-wave{display:none;align-items:center;justify-content:center;gap:3px;height:40px}
.voice-wave.active{display:flex}
.voice-wave span{width:3px;border-radius:2px;background:linear-gradient(180deg,#1DB954,#00B4D8);animation:voiceBar 0.8s ease-in-out infinite}
.voice-wave span:nth-child(1){height:8px;animation-delay:0s}
.voice-wave span:nth-child(2){height:16px;animation-delay:0.1s}
.voice-wave span:nth-child(3){height:24px;animation-delay:0.2s}
.voice-wave span:nth-child(4){height:16px;animation-delay:0.3s}
.voice-wave span:nth-child(5){height:8px;animation-delay:0.4s}
@keyframes voiceBar{0%,100%{transform:scaleY(0.5)}50%{transform:scaleY(1)}}

/* 底部安全区 */
@supports(padding-bottom:env(safe-area-inset-bottom)){.chat-input-area{padding-bottom:calc(24px + env(safe-area-inset-bottom))}}

/* 演示模式按钮 */
.demo-btn{position:fixed;bottom:24px;right:24px;z-index:30;padding:10px 18px;border-radius:24px;background:linear-gradient(135deg,#1DB954,#00B4D8);border:none;color:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 4px 20px rgba(0,0,0,0.4);letter-spacing:1px;transition:all 0.3s}
.demo-btn:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(0,0,0,0.5)}
.demo-btn:active{transform:scale(0.95)}
.demo-btn.running{background:linear-gradient(135deg,#ef4444,#f97316);animation:btnPulse 1s infinite}
@keyframes btnPulse{0%,100%{box-shadow:0 4px 20px rgba(239,68,68,0.4)}50%{box-shadow:0 4px 30px rgba(239,68,68,0.7)}}

/* 问答索引 */
.qa-index{position:fixed;bottom:80px;right:24px;z-index:30;background:rgba(5,10,8,0.95);border:1px solid rgba(0,255,160,0.15);border-radius:12px;padding:12px;display:none;max-height:300px;overflow-y:auto;min-width:200px}
.qa-index.show{display:block}
.qa-index-title{font-size:11px;color:rgba(0,255,160,0.6);margin-bottom:8px;letter-spacing:1px}
.qa-item{padding:6px 10px;border-radius:6px;font-size:11px;color:rgba(255,255,255,0.7);cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:6px;margin-bottom:2px}
.qa-item:hover{background:rgba(0,255,160,0.08);color:#fff}
.qa-item.active{background:rgba(0,255,160,0.12);color:#00FFA0}
.qa-item .num{flex-shrink:0;width:18px;height:18px;border-radius:50%;background:rgba(0,255,160,0.1);border:1px solid rgba(0,255,160,0.2);display:flex;align-items:center;justify-content:center;font-size:9px;color:rgba(0,255,160,0.5)}
</style>
</head>

// ========== 粒子背景 ==========
(function(){
  var canvas=document.createElement('canvas');
  var ctx=canvas.getContext('2d');
  document.getElementById('particles').appendChild(canvas);
  var w,h,particles=[];
  function resize(){w=canvas.width=window.innerWidth;h=canvas.height=window.innerHeight}
  resize();window.addEventListener('resize',resize);
  for(var i=0;i<60;i++){
    particles.push({
      x:Math.random()*w,y:Math.random()*h,
      r:Math.random()*1.5+0.3,
      vx:(Math.random()-0.5)*0.3,vy:(Math.random()-0.5)*0.3,
      alpha:Math.random()*0.5+0.1
    });
  }
  function draw(){
    ctx.clearRect(0,0,w,h);
    particles.forEach(function(p){
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<0)p.x=w;if(p.x>w)p.x=0;
      if(p.y<0)p.y=h;if(p.y>h)p.y=0;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle='rgba(0,255,160,'+p.alpha+')';
      ctx.fill();
    });
    for(var i=0;i<particles.length;i++){
      for(var j=i+1;j<particles.length;j++){
        var dx=particles[i].x-particles[j].x,dy=particles[i].y-particles[j].y;
        var dist=Math.sqrt(dx*dx+dy*dy);
        if(dist<120){
          ctx.beginPath();
          ctx.moveTo(particles[i].x,particles[i].y);
          ctx.lineTo(particles[j].x,particles[j].y);
          ctx.strokeStyle='rgba(0,255,160,'+(0.08*(1-dist/120))+')';
          ctx.lineWidth=0.5;
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(draw);
  }
  draw();
})();

// ========== 演示模式 ==========
var demoRunning=false;
var demoIndex=0;
var demoTimer=null;

function toggleDemo(){
  if(demoRunning){
    stopDemo();
  } else {
    startDemo();
  }
}

function startDemo(){
  demoRunning=true;
  var btn=document.getElementById('demoBtn');
  btn.textContent='⏹ 停止演示';
  btn.classList.add('running');
  
  var index=document.getElementById('qaIndex');
  var html='<div class="qa-index-title">问答场景列表</div>';
  allQA.forEach(function(qa,i){
    html+='<div class="qa-item" id="qaItem'+i+'" onclick="jumpToQA('+i+')"><span class="num">'+(i+1)+'</span>'+qa.q+'</div>';
  });
  index.innerHTML=html;
  index.classList.add('show');
  
  demoIndex=0;
  openChat();
  setTimeout(function(){runDemoStep()},800);
}

function stopDemo(){
  demoRunning=false;
  clearTimeout(demoTimer);
  var btn=document.getElementById('demoBtn');
  btn.textContent='▶ 问答演示';
  btn.classList.remove('running');
  document.getElementById('qaIndex').classList.remove('show');
}

function runDemoStep(){
  if(!demoRunning)return;
  
  var qa=allQA[demoIndex];
  
  document.querySelectorAll('.qa-item').forEach(function(el){el.classList.remove('active')});
  var item=document.getElementById('qaItem'+demoIndex);
  if(item)item.classList.add('active');
  
  var msgs=document.getElementById('chatMessages');
  msgs.innerHTML='';
  
  setTimeout(function(){
    addMsg(qa.q,'user');
    showTyping();
    setTimeout(function(){
      hideTyping();
      addMsg(qa.a,'bot');
      demoIndex++;
      if(demoIndex>=allQA.length){
        setTimeout(function(){
          addMsg('✅ 问答演示完成！共展示 <b>12个场景</b><br><br>您可以继续提问，或点击"<b>停止演示</b>"退出。','bot');
        },1500);
      } else {
        demoTimer=setTimeout(runDemoStep,4000);
      }
    },1500);
  },600);
}

function jumpToQA(idx){
  if(!demoRunning)return;
  clearTimeout(demoTimer);
  demoIndex=idx;
  runDemoStep();
}

// ========== 聊天逻辑 ==========
function openChat(){
  document.getElementById('mainScreen').classList.add('hidden');
  document.getElementById('chatScreen').classList.add('active');
  setTimeout(function(){document.getElementById('chatInput').focus()},300);
}
function closeChat(){
  document.getElementById('chatScreen').classList.remove('active');
  document.getElementById('mainScreen').classList.remove('hidden');
}
function quickAsk(q){
  openChat();
  setTimeout(function(){addMsg(q,'user');processReply(q)},400);
}
function sendMsg(){
  var input=document.getElementById('chatInput');
  var q=input.value.trim();
  if(!q)return;
  input.value='';
  addMsg(q,'user');
  processReply(q);
}
function addMsg(text,type){
  var div=document.createElement('div');
  div.className='chat-msg '+type;
  div.innerHTML=text.replace(/\n/g,'<br>');
  document.getElementById('chatMessages').appendChild(div);
  document.getElementById('chatMessages').scrollTop=999999;
}
function showTyping(){
  var div=document.createElement('div');
  div.className='chat-msg typing';
  div.id='typingIndicator';
  div.innerHTML='<span></span><span></span><span></span>';
  document.getElementById('chatMessages').appendChild(div);
  document.getElementById('chatMessages').scrollTop=999999;
}
function hideTyping(){
  var el=document.getElementById('typingIndicator');
  if(el)el.remove();
}

function processReply(q){
  showTyping();
  setTimeout(function(){
    hideTyping();
    var reply=null;
    for(var i=0;i<allQA.length;i++){
      if(q.includes(allQA[i].q)||allQA[i].q.includes(q)||q.includes('情况')||q.includes('报告')||q.includes('查询')){
        reply=allQA[i].a;
        break;
      }
    }
    if(!reply){
      reply='抱歉，我暂时无法回答这个问题。<br><br>您可以问我：<br><b>土壤墒情、虫情监测、今日预警、作物长势、产量预测、设备状态、灌溉情况、台风动态、收割计划、高温应对、巡检报告、苗情分析</b><br><br>或点击右下角"<b>问答演示</b>"查看所有场景。';
    }
    addMsg(reply,'bot');
  },1200+Math.random()*800);
}

// 长按语音模拟
var pressTimer;
var inputWrap=document.querySelector('.chat-input-wrap');
var inputEl=document.getElementById('chatInput');
var voiceWave=document.getElementById('voiceWave');

inputWrap.addEventListener('touchstart',function(e){
  if(e.target===inputEl||e.target.tagName==='BUTTON')return;
  pressTimer=setTimeout(function(){
    inputEl.style.display='none';
    voiceWave.classList.add('active');
    setTimeout(function(){
      voiceWave.classList.remove('active');
      inputEl.style.display='';
      quickAsk('当前农场整体状况如何');
    },2500);
  },600);
});
inputWrap.addEventListener('touchend',function(){clearTimeout(pressTimer)});
inputWrap.addEventListener('touchmove',function(){clearTimeout(pressTimer)});
</script>
