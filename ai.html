<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>农场AI助手 · 未来版</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=Orbitron:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:'Noto Sans SC',sans-serif;background:#020408;color:#fff}

/* ========== 全息网格背景 ========== */
#particles{position:fixed;inset:0;z-index:0}
#particles canvas{display:block}

.holo-grid{position:fixed;inset:0;z-index:1;pointer-events:none;background:
  linear-gradient(rgba(0,255,160,0.03) 1px,transparent 1px),
  linear-gradient(90deg,rgba(0,255,160,0.03) 1px,transparent 1px);
  background-size:60px 60px;
  animation:gridMove 20s linear infinite}
@keyframes gridMove{0%{background-position:0 0}100%{background-position:60px 60px}}

/* 扫描线 */
.scan-line{position:fixed;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(0,255,160,0.3),rgba(0,180,255,0.3),rgba(0,255,160,0.3),transparent);animation:scan 3s linear infinite;z-index:2;pointer-events:none;box-shadow:0 0 20px rgba(0,255,160,0.2)}
@keyframes scan{0%{top:-1px}100%{top:100vh}}

/* 数据流雨 */
.data-rain{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.data-rain span{position:absolute;top:-20px;font-family:'Orbitron',monospace;font-size:10px;color:rgba(0,255,160,0.08);animation:rainFall linear infinite;white-space:nowrap}
@keyframes rainFall{0%{transform:translateY(-20px)}100%{transform:translateY(100vh)}}

/* 边缘光效 */
.edge-glow{position:fixed;inset:0;z-index:2;pointer-events:none;border:1px solid rgba(0,255,160,0.08);box-shadow:inset 0 0 80px rgba(0,255,160,0.03)}

/* ========== 主界面 ========== */
.main-screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.8s cubic-bezier(0.4,0,0.2,1),transform 0.8s cubic-bezier(0.4,0,0.2,1)}
.main-screen.hidden{opacity:0;transform:scale(0.9) translateY(20px);pointer-events:none}

/* ========== AI核心全息球 ========== */
.ai-core{position:relative;width:220px;height:220px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.ai-core-ring{position:absolute;inset:0;border-radius:50%;border:1.5px solid transparent;background:linear-gradient(135deg,rgba(0,255,160,0.4),rgba(0,180,255,0.4),rgba(0,255,160,0.4)) border-box;-webkit-mask:linear-gradient(#fff 0 0) padding-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:ringSpin 3s linear infinite}
.ai-core-ring:nth-child(2){inset:15px;animation-duration:4s;animation-direction:reverse;opacity:0.6}
.ai-core-ring:nth-child(3){inset:30px;animation-duration:5s;opacity:0.3}
@keyframes ringSpin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}

.ai-core-orb{position:absolute;inset:45px;border-radius:50%;background:
  radial-gradient(circle at 30% 30%,rgba(0,255,160,0.6),transparent 60%),
  radial-gradient(circle at 70% 70%,rgba(0,180,255,0.4),transparent 60%),
  radial-gradient(circle at 50% 50%,rgba(0,255,160,0.15),rgba(0,100,200,0.1));
  box-shadow:0 0 60px rgba(0,255,160,0.3),0 0 120px rgba(0,180,255,0.15),inset 0 0 40px rgba(0,255,160,0.1);animation:orbPulse 2s ease-in-out infinite}
@keyframes orbPulse{0%,100%{box-shadow:0 0 60px rgba(0,255,160,0.3),0 0 120px rgba(0,180,255,0.15),inset 0 0 40px rgba(0,255,160,0.1)}50%{box-shadow:0 0 80px rgba(0,255,160,0.5),0 0 160px rgba(0,180,255,0.25),inset 0 0 60px rgba(0,255,160,0.2)}}

.ai-core-inner{position:absolute;inset:70px;border-radius:50%;background:radial-gradient(circle at 40% 40%,rgba(255,255,255,0.15),transparent 50%);animation:innerGlow 3s ease-in-out infinite}
@keyframes innerGlow{0%,100%{opacity:0.5}50%{opacity:1}}

.ai-core-icon{position:relative;z-index:3;font-size:56px;animation:float 3s ease-in-out infinite;text-shadow:0 0 30px rgba(0,255,160,0.5)}
@keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-10px) scale(1.05)}}

.ai-core::after{content:'';position:absolute;bottom:-30px;left:50%;transform:translateX(-50%);width:120px;height:20px;background:radial-gradient(ellipse,rgba(0,255,160,0.2),transparent 70%);border-radius:50%;animation:shadowPulse 2s ease-in-out infinite}
@keyframes shadowPulse{0%,100%{opacity:0.3;transform:translateX(-50%) scale(1)}50%{opacity:0.6;transform:translateX(-50%) scale(1.2)}}

/* 能量粒子 */
.energy-particles{position:absolute;inset:-40px;pointer-events:none}
.energy-particles::before,.energy-particles::after{content:'';position:absolute;border-radius:50%;animation:energyBurst 2s ease-out infinite}
.energy-particles::before{width:4px;height:4px;background:rgba(0,255,160,0.8);top:20%;left:20%;animation-delay:0s}
.energy-particles::after{width:3px;height:3px;background:rgba(0,180,255,0.8);top:70%;right:15%;animation-delay:1s}
@keyframes energyBurst{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(3) translateY(-30px)}}

/* 标题 */
.ai-title{text-align:center;margin-top:40px;animation:titleIn 1s ease-out 0.3s both}
@keyframes titleIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.ai-title h1{font-size:26px;font-weight:900;letter-spacing:6px;color:#fff;text-shadow:0 0 30px rgba(0,255,160,0.4),0 0 60px rgba(0,180,255,0.2);font-family:'Orbitron','Noto Sans SC',sans-serif}
.ai-title .subtitle{font-size:11px;color:rgba(0,255,160,0.5);margin-top:12px;letter-spacing:3px;font-family:'Orbitron',monospace}
.ai-title .subtitle::before,.ai-title .subtitle::after{content:'◆';margin:0 10px;color:rgba(0,255,160,0.3);font-size:8px}

/* ========== 快捷卡片 ========== */
.quick-cards{display:flex;gap:12px;margin-top:48px;padding:0 20px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;animation:cardsIn 1s ease-out 0.6s both}
@keyframes cardsIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.quick-cards::-webkit-scrollbar{display:none}

.quick-card{flex-shrink:0;width:150px;padding:18px;border-radius:20px;background:linear-gradient(135deg,rgba(0,255,160,0.04),rgba(0,180,255,0.04));border:1px solid rgba(0,255,160,0.1);backdrop-filter:blur(20px);scroll-snap-align:center;cursor:pointer;transition:all 0.4s cubic-bezier(0.4,0,0.2,1);position:relative;overflow:hidden}
.quick-card::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(0,255,160,0.1),transparent);transition:left 0.6s}
.quick-card:hover::before{left:100%}
.quick-card:hover{transform:translateY(-6px) scale(1.02);border-color:rgba(0,255,160,0.3);box-shadow:0 10px 40px rgba(0,255,160,0.1),0 0 20px rgba(0,180,255,0.05)}
.quick-card:active{transform:scale(0.97)}

.quick-card .icon{font-size:32px;margin-bottom:10px;display:block;filter:drop-shadow(0 0 8px rgba(0,255,160,0.3))}
.quick-card .label{font-size:13px;font-weight:800;color:#fff;letter-spacing:1px}
.quick-card .desc{font-size:10px;color:rgba(0,255,160,0.5);margin-top:6px;line-height:1.5}

/* 卡片角标 */
.quick-card::after{content:'';position:absolute;top:0;right:0;width:30px;height:30px;background:linear-gradient(135deg,rgba(0,255,160,0.2),transparent);border-radius:0 20px 0 0}

/* ========== 聊天界面 ========== */
.chat-screen{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;background:linear-gradient(180deg,#020408 0%,#0a1520 50%,#020408 100%);opacity:0;pointer-events:none;transition:opacity 0.5s cubic-bezier(0.4,0,0.2,1)}
.chat-screen.active{opacity:1;pointer-events:auto}

.chat-header{flex-shrink:0;display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid rgba(0,255,160,0.1);background:rgba(2,4,8,0.8);backdrop-filter:blur(20px);position:relative}
.chat-header::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(0,255,160,0.3),transparent)}

.chat-header-back{width:40px;height:40px;border-radius:50%;background:rgba(0,255,160,0.05);border:1px solid rgba(0,255,160,0.15);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.3s}
.chat-header-back:hover{background:rgba(0,255,160,0.1);box-shadow:0 0 20px rgba(0,255,160,0.2)}
.chat-header-back svg{width:18px;height:18px;stroke:#00FFA0;stroke-width:2;fill:none}

.chat-header-info{flex:1}
.chat-header-info h2{font-size:16px;font-weight:800;letter-spacing:2px;color:#fff;text-shadow:0 0 10px rgba(0,255,160,0.3)}
.chat-header-info p{font-size:10px;color:rgba(0,255,160,0.4);margin-top:3px;letter-spacing:1px;font-family:'Orbitron',monospace}

.chat-header-status{width:10px;height:10px;border-radius:50%;background:#00FFA0;box-shadow:0 0 12px #00FFA0,0 0 24px rgba(0,255,160,0.3);animation:statusPulse 2s infinite}
@keyframes statusPulse{0%,100%{opacity:1;box-shadow:0 0 12px #00FFA0,0 0 24px rgba(0,255,160,0.3)}50%{opacity:0.5;box-shadow:0 0 6px #00FFA0,0 0 12px rgba(0,255,160,0.15)}}

/* 消息区域 */
.chat-messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:18px;position:relative}
.chat-messages::before{content:'';position:fixed;left:20px;top:80px;bottom:80px;width:1px;background:linear-gradient(180deg,transparent,rgba(0,255,160,0.2),transparent)}

.chat-msg{max-width:82%;padding:14px 18px;border-radius:20px;font-size:13px;line-height:1.8;animation:msgIn 0.4s cubic-bezier(0.4,0,0.2,1);position:relative}
@keyframes msgIn{from{opacity:0;transform:translateY(15px) scale(0.95)}to{opacity:1;transform:translateY(0) scale(1)}}

.chat-msg.user{align-self:flex-end;background:linear-gradient(135deg,rgba(0,255,160,0.12),rgba(0,180,255,0.08));border:1px solid rgba(0,255,160,0.2);color:#fff;box-shadow:0 4px 20px rgba(0,255,160,0.08),inset 0 1px 0 rgba(255,255,255,0.05)}
.chat-msg.user::after{content:'';position:absolute;bottom:0;right:-8px;width:16px;height:16px;background:linear-gradient(135deg,rgba(0,255,160,0.12),rgba(0,180,255,0.08));border-right:1px solid rgba(0,255,160,0.2);border-bottom:1px solid rgba(0,255,160,0.2);transform:rotate(-45deg);transform-origin:0 0}

.chat-msg.bot{align-self:flex-start;background:linear-gradient(135deg,rgba(0,180,255,0.06),rgba(0,255,160,0.04));border:1px solid rgba(0,180,255,0.12);color:rgba(255,255,255,0.9);box-shadow:0 4px 20px rgba(0,180,255,0.05),inset 0 1px 0 rgba(255,255,255,0.03)}
.chat-msg.bot::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,rgba(0,180,255,0.3),transparent);border-radius:20px 20px 0 0}
.chat-msg.bot b{color:#00FFA0;text-shadow:0 0 8px rgba(0,255,160,0.3)}

/* 打字指示器 */
.chat-msg.typing{display:flex;align-items:center;gap:5px;padding:16px 22px;background:rgba(0,180,255,0.04);border:1px solid rgba(0,180,255,0.1)}
.chat-msg.typing span{width:7px;height:7px;border-radius:50%;background:rgba(0,255,160,0.6);animation:typingBounce 1.4s infinite;box-shadow:0 0 10px rgba(0,255,160,0.3)}
.chat-msg.typing span:nth-child(2){animation-delay:0.2s}
.chat-msg.typing span:nth-child(3){animation-delay:0.4s}
@keyframes typingBounce{0%,80%,100%{transform:scale(0.5);opacity:0.3}40%{transform:scale(1);opacity:1}}

/* 输入区域 */
.chat-input-area{flex-shrink:0;padding:14px 20px 28px;border-top:1px solid rgba(0,255,160,0.08);background:rgba(2,4,8,0.9);backdrop-filter:blur(20px);position:relative}
.chat-input-area::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(0,255,160,0.2),transparent)}

.chat-input-wrap{display:flex;align-items:center;gap:12px;background:rgba(0,255,160,0.03);border:1px solid rgba(0,255,160,0.12);border-radius:28px;padding:5px 5px 5px 20px;transition:all 0.3s}
.chat-input-wrap:focus-within{border-color:rgba(0,255,160,0.3);box-shadow:0 0 20px rgba(0,255,160,0.08),inset 0 0 20px rgba(0,255,160,0.03)}

.chat-input-wrap input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:14px;font-family:inherit}
.chat-input-wrap input::placeholder{color:rgba(0,255,160,0.3)}

.chat-input-wrap button{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#00FFA0,#00B4D8);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.3s;box-shadow:0 4px 15px rgba(0,255,160,0.3)}
.chat-input-wrap button:hover{transform:scale(1.05);box-shadow:0 6px 25px rgba(0,255,160,0.4)}
.chat-input-wrap button:active{transform:scale(0.92)}
.chat-input-wrap button svg{width:20px;height:20px;stroke:#020408;stroke-width:2.5;fill:none}

/* 语音波纹 */
.voice-wave{display:none;align-items:center;justify-content:center;gap:4px;height:44px}
.voice-wave.active{display:flex}
.voice-wave span{width:3px;border-radius:3px;background:linear-gradient(180deg,#00FFA0,#00B4D8);animation:voiceBar 0.6s ease-in-out infinite;box-shadow:0 0 10px rgba(0,255,160,0.3)}
.voice-wave span:nth-child(1){height:10px;animation-delay:0s}
.voice-wave span:nth-child(2){height:20px;animation-delay:0.1s}
.voice-wave span:nth-child(3){height:30px;animation-delay:0.2s}
.voice-wave span:nth-child(4){height:20px;animation-delay:0.3s}
.voice-wave span:nth-child(5){height:10px;animation-delay:0.4s}
@keyframes voiceBar{0%,100%{transform:scaleY(0.4)}50%{transform:scaleY(1)}}

/* 底部安全区 */
@supports(padding-bottom:env(safe-area-inset-bottom)){.chat-input-area{padding-bottom:calc(28px + env(safe-area-inset-bottom))}}

/* ========== 演示模式 ========== */
.demo-btn{position:fixed;bottom:28px;right:24px;z-index:30;padding:12px 22px;border-radius:28px;background:linear-gradient(135deg,rgba(0,255,160,0.15),rgba(0,180,255,0.15));border:1px solid rgba(0,255,160,0.2);color:#00FFA0;font-size:12px;font-weight:800;cursor:pointer;font-family:'Orbitron','Noto Sans SC',sans-serif;box-shadow:0 4px 20px rgba(0,0,0,0.4),0 0 20px rgba(0,255,160,0.1);letter-spacing:2px;transition:all 0.3s;backdrop-filter:blur(10px)}
.demo-btn:hover{transform:translateY(-2px);box-shadow:0 6px 30px rgba(0,0,0,0.5),0 0 30px rgba(0,255,160,0.2);border-color:rgba(0,255,160,0.4)}
.demo-btn:active{transform:scale(0.95)}
.demo-btn.running{background:linear-gradient(135deg,rgba(239,68,68,0.2),rgba(249,115,22,0.2));border-color:rgba(239,68,68,0.3);color:#ff6b6b;animation:btnPulse 1s infinite}
@keyframes btnPulse{0%,100%{box-shadow:0 4px 20px rgba(239,68,68,0.2),0 0 20px rgba(239,68,68,0.1)}50%{box-shadow:0 4px 30px rgba(239,68,68,0.4),0 0 40px rgba(239,68,68,0.2)}}

/* 问答索引 */
.qa-index{position:fixed;bottom:90px;right:24px;z-index:30;background:rgba(2,4,8,0.95);border:1px solid rgba(0,255,160,0.15);border-radius:16px;padding:16px;display:none;max-height:320px;overflow-y:auto;min-width:220px;backdrop-filter:blur(20px);box-shadow:0 10px 40px rgba(0,0,0,0.5),0 0 30px rgba(0,255,160,0.05)}
.qa-index.show{display:block;animation:indexIn 0.3s ease-out}
@keyframes indexIn{from{opacity:0;transform:translateY(10px) scale(0.95)}to{opacity:1;transform:translateY(0) scale(1)}}
.qa-index-title{font-size:11px;color:rgba(0,255,160,0.6);margin-bottom:10px;letter-spacing:2px;font-family:'Orbitron',monospace}
.qa-item{padding:8px 12px;border-radius:8px;font-size:11px;color:rgba(255,255,255,0.7);cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:8px;margin-bottom:3px;border:1px solid transparent}
.qa-item:hover{background:rgba(0,255,160,0.06);color:#fff;border-color:rgba(0,255,160,0.1)}
.qa-item.active{background:rgba(0,255,160,0.1);color:#00FFA0;border-color:rgba(0,255,160,0.2);box-shadow:0 0 15px rgba(0,255,160,0.1)}
.qa-item .num{flex-shrink:0;width:22px;height:22px;border-radius:50%;background:rgba(0,255,160,0.08);border:1px solid rgba(0,255,160,0.15);display:flex;align-items:center;justify-content:center;font-size:9px;color:rgba(0,255,160,0.6);font-family:'Orbitron',monospace}
.qa-item.active .num{background:rgba(0,255,160,0.2);color:#00FFA0;border-color:rgba(0,255,160,0.3)}

/* 时间戳 */
.msg-time{font-size:9px;color:rgba(0,255,160,0.3);margin-top:6px;text-align:right;font-family:'Orbitron',monospace;letter-spacing:1px}
</style>
</head>
<body>

<!-- 粒子背景 -->
<div id="particles"></div>
<div class="holo-grid"></div>
<div class="data-rain" id="dataRain"></div>
<div class="scan-line"></div>
<div class="edge-glow"></div>

<!-- 主界面 -->
<div class="main-screen" id="mainScreen">
  <div class="ai-core" id="aiCore" onclick="openChat()">
    <div class="ai-core-ring"></div>
    <div class="ai-core-ring"></div>
    <div class="ai-core-ring"></div>
    <div class="ai-core-orb"></div>
    <div class="ai-core-inner"></div>
    <div class="ai-core-icon">🌾</div>
    <div class="energy-particles"></div>
  </div>
  <div class="ai-title">
    <h1>农场AI助手</h1>
    <div class="subtitle">FUTURE INTELLIGENCE</div>
  </div>
  <div class="quick-cards">
    <div class="quick-card" onclick="quickAsk('土壤墒情')">
      <span class="icon">💧</span>
      <div class="label">土壤墒情</div>
      <div class="desc">实时监测三层土壤数据</div>
    </div>
    <div class="quick-card" onclick="quickAsk('虫情监测')">
      <span class="icon">🐛</span>
      <div class="label">虫情监测</div>
      <div class="desc">AI识别虫害趋势预警</div>
    </div>
    <div class="quick-card" onclick="quickAsk('今日预警')">
      <span class="icon">🚨</span>
      <div class="label">今日预警</div>
      <div class="desc">紧急异常一键查看</div>
    </div>
    <div class="quick-card" onclick="quickAsk('作物长势')">
      <span class="icon">🌾</span>
      <div class="label">长势分析</div>
      <div class="desc">多光谱AI长势评估</div>
    </div>
    <div class="quick-card" onclick="quickAsk('产量预测')">
      <span class="icon">📈</span>
      <div class="label">产量预测</div>
      <div class="desc">智能预估亩产总产</div>
    </div>
    <div class="quick-card" onclick="quickAsk('设备状态')">
      <span class="icon">📡</span>
      <div class="label">设备状态</div>
      <div class="desc">IoT设备在线监控</div>
    </div>
  </div>
</div>

<!-- 演示按钮 -->
<button class="demo-btn" id="demoBtn" onclick="toggleDemo()">▶ DEMO</button>

<!-- 问答索引面板 -->
<div class="qa-index" id="qaIndex"></div>

<!-- 聊天界面 -->
<div class="chat-screen" id="chatScreen">
  <div class="chat-header">
    <div class="chat-header-back" onclick="closeChat()">
      <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </div>
    <div class="chat-header-info">
      <h2>农场AI助手</h2>
      <p>FUTURE INTELLIGENCE v2.0</p>
    </div>
    <div class="chat-header-status"></div>
  </div>
  <div class="chat-messages" id="chatMessages">
    <div class="chat-msg bot">您好！我是邗江区无人农场AI助手 🌾<br><br>可以为您解答农情监测、设备管理、预警处置、产量预测等问题。<br><br>您可以直接语音输入，或点击下方快捷卡片。</div>
  </div>
  <div class="chat-input-area">
    <div class="chat-input-wrap">
      <input type="text" id="chatInput" placeholder="输入问题，或长按语音..." onkeydown="if(event.key==='Enter')sendMsg()">
      <div class="voice-wave" id="voiceWave">
        <span></span><span></span><span></span><span></span><span></span>
      </div>

// ========== 全息粒子背景 ==========
(function(){
  var canvas=document.createElement('canvas');
  var ctx=canvas.getContext('2d');
  document.getElementById('particles').appendChild(canvas);
  var w,h,particles=[];
  function resize(){w=canvas.width=window.innerWidth;h=canvas.height=window.innerHeight}
  resize();window.addEventListener('resize',resize);
  for(var i=0;i<80;i++){
    particles.push({
      x:Math.random()*w,y:Math.random()*h,
      r:Math.random()*2+0.5,
      vx:(Math.random()-0.5)*0.4,vy:(Math.random()-0.5)*0.4,
      alpha:Math.random()*0.6+0.1,
      hue:Math.random()>0.5?160:200
    });
  }
  function draw(){
    ctx.fillStyle='rgba(2,4,8,0.15)';
    ctx.fillRect(0,0,w,h);
    particles.forEach(function(p){
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<0)p.x=w;if(p.x>w)p.x=0;
      if(p.y<0)p.y=h;if(p.y>h)p.y=0;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle='hsla('+p.hue+',100%,60%,'+p.alpha+')';
      ctx.fill();
      ctx.shadowBlur=10;
      ctx.shadowColor='hsla('+p.hue+',100%,60%,0.3)';
    });
    ctx.shadowBlur=0;
    for(var i=0;i<particles.length;i++){
      for(var j=i+1;j<particles.length;j++){
        var dx=particles[i].x-particles[j].x,dy=particles[i].y-particles[j].y;
        var dist=Math.sqrt(dx*dx+dy*dy);
        if(dist<150){
          ctx.beginPath();
          ctx.moveTo(particles[i].x,particles[i].y);
          ctx.lineTo(particles[j].x,particles[j].y);
          var hue=(particles[i].hue+particles[j].hue)/2;
          ctx.strokeStyle='hsla('+hue+',100%,60%,'+(0.1*(1-dist/150))+')';
          ctx.lineWidth=0.5;
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(draw);
  }
  draw();
})();

// ========== 演示模式 ==========
var demoRunning=false;
var demoIndex=0;
var demoTimer=null;

function toggleDemo(){
  if(demoRunning){stopDemo();}else{startDemo();}
}

function startDemo(){
  demoRunning=true;
  var btn=document.getElementById('demoBtn');
  btn.textContent='⏹ STOP';
  btn.classList.add('running');
  var index=document.getElementById('qaIndex');
  var html='<div class="qa-index-title">SCENARIOS</div>';
  allQA.forEach(function(qa,i){
    html+='<div class="qa-item" id="qaItem'+i+'"><span class="num">'+(i+1)+'</span>'+qa.q+'</div>';
  });
  index.innerHTML=html;
  index.classList.add('show');
  demoIndex=0;
  openChat();
  setTimeout(function(){runDemoStep()},800);
}

function stopDemo(){
  demoRunning=false;
  clearTimeout(demoTimer);
  var btn=document.getElementById('demoBtn');
  btn.textContent='▶ DEMO';
  btn.classList.remove('running');
  document.getElementById('qaIndex').classList.remove('show');
}

function runDemoStep(){
  if(!demoRunning)return;
  var qa=allQA[demoIndex];
  document.querySelectorAll('.qa-item').forEach(function(el){el.classList.remove('active')});
  var item=document.getElementById('qaItem'+demoIndex);
  if(item)item.classList.add('active');
  setTimeout(function(){
    addMsg(qa.q,'user');
    showTyping();
    setTimeout(function(){
      hideTyping();
      addMsg(qa.a,'bot');
      demoIndex++;
      if(demoIndex>=allQA.length){
        setTimeout(function(){
          addMsg('✅ 演示完成！共展示 <b>12个场景</b><br><br>您可以继续提问，或点击"<b>STOP</b>"退出。','bot');
        },1500);
      }else{
        demoTimer=setTimeout(runDemoStep,4000);
      }
    },1500);
  },600);
}

// ========== 聊天逻辑 ==========
function openChat(){
  document.getElementById('mainScreen').classList.add('hidden');
  document.getElementById('chatScreen').classList.add('active');
  setTimeout(function(){document.getElementById('chatInput').focus()},300);
}
function closeChat(){
  document.getElementById('chatScreen').classList.remove('active');
  document.getElementById('mainScreen').classList.remove('hidden');
}
function quickAsk(q){
  openChat();
  setTimeout(function(){addMsg(q,'user');processReply(q)},400);
}
function sendMsg(){
  var input=document.getElementById('chatInput');
  var q=input.value.trim();
  if(!q)return;
  input.value='';
  addMsg(q,'user');
  processReply(q);
}
function addMsg(text,type){
  var div=document.createElement('div');
  div.className='chat-msg '+type;
  var time=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
  div.innerHTML=text.replace(/\n/g,'<br>')+'<div class="msg-time">'+time+'</div>';
  document.getElementById('chatMessages').appendChild(div);
  document.getElementById('chatMessages').scrollTop=999999;
}
function showTyping(){
  var div=document.createElement('div');
  div.className='chat-msg typing';
  div.id='typingIndicator';
  div.innerHTML='<span></span><span></span><span></span>';
  document.getElementById('chatMessages').appendChild(div);
  document.getElementById('chatMessages').scrollTop=999999;
}
function hideTyping(){
  var el=document.getElementById('typingIndicator');
  if(el)el.remove();
}

function processReply(q){
  showTyping();
  setTimeout(function(){
    hideTyping();
    var reply=null;
    for(var i=0;i<allQA.length;i++){
      if(q.includes(allQA[i].q)||allQA[i].q.includes(q)||q.includes('情况')||q.includes('报告')||q.includes('查询')){
        reply=allQA[i].a;
        break;
      }
    }
    if(!reply){
      reply='抱歉，我暂时无法回答这个问题。<br><br>您可以问我：<br><b>土壤墒情、虫情监测、今日预警、作物长势、产量预测、设备状态、灌溉情况、台风动态、收割计划、高温应对、巡检报告、苗情分析</b><br><br>或点击右下角"<b>DEMO</b>"查看所有场景。';
    }
    addMsg(reply,'bot');
  },1200+Math.random()*800);
}
